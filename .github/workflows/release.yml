name: Release

# Push a tag like v0.2.0 to publish native (AOT) builds for Windows, Linux and macOS.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest, archive: zip }
          - { rid: win-arm64,   os: windows-latest, archive: zip }
          - { rid: linux-x64,   os: ubuntu-latest,  archive: tar.gz }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, archive: tar.gz }
          - { rid: osx-arm64,   os: macos-latest,   archive: zip }
          - { rid: osx-x64,     os: macos-latest,   archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish (Native AOT)
        shell: bash
        run: >
          dotnet publish src/RunnerWatch/RunnerWatch.csproj -c Release -r ${{ matrix.rid }}
          -p:PublishAot=true -p:DebugType=none -p:StripSymbols=true -o out/${{ matrix.rid }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/${{ matrix.rid }}/* -DestinationPath RunnerWatch-${{ matrix.rid }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp packaging/linux/runnerwatch.desktop src/RunnerWatch/Assets/icon-256.png out/${{ matrix.rid }}/
          tar -C out/${{ matrix.rid }} -czf RunnerWatch-${{ matrix.rid }}.tar.gz .

      - name: Package (macOS .app)
        if: runner.os == 'macOS'
        run: |
          packaging/macos/make-app.sh out/${{ matrix.rid }} "${GITHUB_REF_NAME#v}" RunnerWatch.app
          ditto -c -k --keepParent RunnerWatch.app RunnerWatch-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: RunnerWatch-${{ matrix.rid }}
          path: RunnerWatch-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum RunnerWatch-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "RunnerWatch $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md \
            --generate-notes
